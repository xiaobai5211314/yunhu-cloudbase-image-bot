name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ 124.156.206.3 }}
          username: ${{ deploy }}
          port: ${{ 22 }}
          key: ${{ dabai521 }}
          script: |
            set -e
            cd /www/wwwroot/yunhu-cloudbase-image-bot
            git fetch origin main
            git reset --hard origin/main
            if [ -f package-lock.json ]; then
              npm ci --omit=dev
            else
              npm install --omit=dev
            fi
            pm2 restart yunhu-cloudbase-image-bot || pm2 start npm --name yunhu-cloudbase-image-bot -- start
            pm2 save
            pm2 status
